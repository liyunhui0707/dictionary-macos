name: 问题反馈
description: 反馈选词、语境、服务连接或安装使用问题。
body:
  - type: markdown
    attributes:
      value: |
        请使用自行编写的最小例句复现。不要提交 API 密钥、扩展令牌、个人路径、完整书籍或聊天记录；截图请先遮住私人内容。
        App 的“诊断与反馈”可预览并保存固定状态报告，是否附带由你决定。
  - type: input
    id: version
    attributes:
      label: Dictionary 版本
      placeholder: 在“关于 Dictionary”中查看，例如 0.9.1。
  - type: dropdown
    id: reader
    attributes:
      label: 出现问题的位置
      options:
        - 主窗口手动输入
        - Apple Books
        - Readest
        - 浏览器扩展
        - Session Manager
        - Markdown
        - 其他或不确定
  - type: dropdown
    id: service
    attributes:
      label: 查词服务
      options:
        - Ollama 本地
        - DeepSeek 云端
        - 尚未配置或不确定
        - 启动时指定的其他服务
  - type: textarea
    id: reproduction
    attributes:
      label: 在哪个软件、选了什么、哪里不对
      description: 一两句话即可。能提供自行编写的例句更好；不必先重复测试、重启或调整权限。模型名称、版本和诊断报告均可稍后补充。
      placeholder: 例如：Books，选中 bank，词选对了但没有原句。合成例句：They waited on the bank of the stream.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: diagnostics
    attributes:
      label: 可选诊断报告
      description: 可粘贴 App 预览后的报告，或自行附上保存的文本。不要粘贴原始模型日志、密钥或令牌。
