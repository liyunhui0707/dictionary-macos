name: 问题反馈
description: 反馈选词、语境、服务连接或安装使用问题。
body:
  - type: markdown
    attributes:
      value: |
        请使用自行编写的最小例句复现。不要提交 API 密钥、扩展令牌、个人路径、完整书籍或聊天记录；截图请先遮住私人内容。
        App 的“诊断与反馈”可预览并保存固定状态报告，是否附带由你决定。
  - type: input
    id: version
    attributes:
      label: Dictionary 版本
      placeholder: 在“关于 Dictionary”中查看，例如 0.5.0。
  - type: dropdown
    id: reader
    attributes:
      label: 出现问题的位置
      options:
        - 主窗口手动输入
        - Apple Books
        - Readest
        - 浏览器扩展
        - Session Manager
        - Markdown
        - 其他或不确定
  - type: dropdown
    id: service
    attributes:
      label: 查词服务
      options:
        - Ollama 本地
        - DeepSeek 云端
        - 尚未配置或不确定
        - 启动时指定的其他服务
  - type: textarea
    id: reproduction
    attributes:
      label: 如何复现
      description: 简要写明操作顺序。词义问题可提供自行编写的例句及所用模型名称，避免粘贴私人正文。
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 例如没有弹窗、原句缺失、原句不对应、服务报错或原句正确但词义不符。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
  - type: textarea
    id: diagnostics
    attributes:
      label: 可选诊断报告
      description: 可粘贴 App 预览后的报告，或自行附上保存的文本。不要粘贴原始模型日志、密钥或令牌。
